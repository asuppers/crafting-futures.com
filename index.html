<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crafting Futures – Uganda</title>
<link rel="icon" type="image/png" href="images/logo-icon.png" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --orange: #e0a83d;
    --orange-light: #edc272;
    --brown: #33455e;
    --beige: #f6f4ec;
    --beige-dark: #ece7d8;
    --text: #2b2f36;
    --text-light: #6b6f76;
    --white: #ffffff;
    --green: #6e8f3e;
    --green-light: #a8c97a;
  }
  body { font-family: 'Georgia', serif; color: var(--text); background: var(--white); }
  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
    background: var(--white); color: var(--brown);
    box-shadow: 0 2px 12px rgba(51,69,94,0.08);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; height: 92px;
  }
  .nav-logo { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: bold; letter-spacing: 0.05em; color: var(--brown); text-decoration: none; }
  .nav-logo img { height: 72px; width: auto; display: block; }
  .nav-logo span { color: var(--green); }
  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a { color: var(--brown); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.2s; font-family: Arial, sans-serif; }
  .nav-links a:hover { color: var(--orange); }
  .nav-donate {
    background: var(--orange); color: white; padding: 10px 24px;
    border-radius: 999px; text-decoration: none; font-size: 0.85rem;
    font-family: Arial, sans-serif; font-weight: bold; letter-spacing: 0.05em;
    transition: background 0.2s;
  }
  .nav-donate:hover { background: var(--brown); }
  /* HERO */
  .hero {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--brown); position: relative; overflow: hidden;
    background: var(--beige);
  }
  .hero-slideshow { position: absolute; inset: 0; }
  .hero-slide {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1.8s ease-in-out;
  }
  .hero-slide.active { opacity: 0.92; }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(246,244,236,0.15) 0%, rgba(246,244,236,0.75) 100%);
  }
  .hero-content { position: relative; z-index: 1; padding: 0 20px; }
  .hero-tag {
    display: inline-block; background: var(--orange); color: white;
    padding: 6px 20px; border-radius: 999px; font-size: 0.8rem;
    letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 24px;
    font-family: Arial, sans-serif;
  }
  .hero h1 { font-size: clamp(2.5rem, 6vw, 5rem); font-weight: normal; margin-bottom: 16px; line-height: 1.15; color: var(--brown); }
  .hero h1 span { color: var(--green); }
  .hero p { font-size: 1.2rem; max-width: 600px; margin: 0 auto 36px; color: var(--text-light); font-style: italic; }
  .hero-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn-primary {
    background: var(--orange); color: white; padding: 14px 32px;
    border-radius: 999px; text-decoration: none; font-family: Arial, sans-serif;
    font-weight: bold; transition: background 0.2s; font-size: 0.95rem;
  }
  .btn-primary:hover { background: var(--brown); }
  .btn-outline {
    border: 2px solid var(--brown); color: var(--brown); padding: 14px 32px;
    border-radius: 999px; text-decoration: none; font-family: Arial, sans-serif;
    font-weight: bold; transition: all 0.2s; font-size: 0.95rem;
  }
  .btn-outline:hover { background: var(--brown); color: white; }
  /* SECTIONS */
  section { padding: 80px 40px; }
  .section-label {
    text-transform: uppercase; letter-spacing: 0.25em; font-size: 0.8rem;
    color: var(--orange); font-family: Arial, sans-serif; margin-bottom: 12px;
  }
  h2 { font-size: clamp(1.8rem, 3vw, 2.8rem); font-weight: normal; color: var(--brown); margin-bottom: 20px; }
  .section-intro { font-size: 1.1rem; color: var(--text-light); max-width: 700px; line-height: 1.8; }
  /* WHO WE ARE */
  #about { background: var(--beige); }
  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; max-width: 1100px; margin: 0 auto; align-items: center; }
  .about-image {
    border-radius: 2rem; overflow: hidden; height: 420px;
    background: url('images/about.jpg') center/cover;
    box-shadow: 0 20px 60px rgba(27,42,74,0.2);
  }
  .about-text h2 { margin-bottom: 16px; }
  .about-text p { color: var(--text-light); line-height: 1.9; margin-bottom: 16px; }
  .team-list { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .team-member {
    display: flex; align-items: center; gap: 12px;
    background: white; padding: 12px 20px; border-radius: 1rem;
  }
  .team-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); flex-shrink: 0; }
  .team-member span { font-family: Arial, sans-serif; font-size: 0.95rem; color: var(--brown); }
  .team-member-combined {
    width: 100%; border: none; cursor: pointer; text-align: left;
    justify-content: space-between; flex-wrap: wrap; row-gap: 6px;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .team-member-combined:hover { background: var(--beige); box-shadow: 0 4px 16px rgba(27,42,74,0.1); }
  .team-photo-hint { font-size: 0.78rem; color: var(--orange); font-style: italic; }
  .photo-modal-box { padding: 12px; max-width: 560px; }
  .photo-modal-box img { width: 100%; border-radius: 1rem; display: block; }
  .photo-modal-box .modal-close { top: 22px; right: 22px; background: rgba(255,255,255,0.9); border-radius: 50%; width: 32px; height: 32px; }
  /* PROJECTS */
  #programs { background: white; }
  .projects-inner { max-width: 1100px; margin: 0 auto; }
  .projects-header { text-align: center; margin-bottom: 60px; }
  .projects-header .section-intro { margin: 0 auto; }
  .project-card {
    background: var(--beige); border-radius: 2rem; padding: 48px;
    margin-bottom: 40px;
    display: grid; grid-template-columns: 1fr 2fr; gap: 40px; align-items: center;
  }
  .project-card:nth-child(even) { grid-template-columns: 2fr 1fr; }
  .project-card:nth-child(even) .project-img { order: 2; }
  .project-card:nth-child(even) .project-content { order: 1; }
  .project-img {
    border-radius: 1.5rem; height: 280px; background: center/cover no-repeat;
    box-shadow: 0 10px 30px rgba(27,42,74,0.15);
  }
  .project-date {
    font-family: Arial, sans-serif; font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.15em; color: var(--orange); margin-bottom: 12px;
  }
  .project-card h3 { font-size: 1.6rem; color: var(--brown); margin-bottom: 16px; }
  .project-card p { color: var(--text-light); line-height: 1.8; margin-bottom: 20px; }
  .workshop-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .workshop-tag {
    background: white; border: 1px solid var(--orange-light);
    color: var(--brown); padding: 6px 14px; border-radius: 999px;
    font-size: 0.8rem; font-family: Arial, sans-serif;
    cursor: pointer; transition: all 0.2s; outline: none;
  }
  .workshop-tag:hover { background: var(--orange); color: white; border-color: var(--orange); }
  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(27,42,74,0.55);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: white; border-radius: 1.5rem; padding: 36px; max-width: 460px;
    width: 100%; position: relative; box-shadow: 0 20px 60px rgba(27,42,74,0.3);
  }
  .modal-close {
    position: absolute; top: 16px; right: 20px; background: none; border: none;
    font-size: 1.4rem; color: var(--text-light); cursor: pointer; line-height: 1;
  }
  .modal-close:hover { color: var(--brown); }
  .modal-box h3 { color: var(--brown); font-size: 1.3rem; margin-bottom: 14px; padding-right: 20px; }
  .modal-box p { color: var(--text-light); font-family: Arial, sans-serif; font-size: 0.95rem; line-height: 1.7; }
  .modal-images { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .modal-images img { width: calc(25% - 8px); border-radius: 0.75rem; object-fit: cover; aspect-ratio: 1; cursor: pointer; transition: opacity 0.2s; }
  .modal-images img:hover { opacity: 0.85; }
  .project-card.upcoming { background: white; border: 2px dashed var(--green); }
  .upcoming-tag {
    display: inline-block; background: var(--green); color: white;
    padding: 4px 14px; border-radius: 999px; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.12em;
    font-family: Arial, sans-serif; font-weight: bold; margin-bottom: 10px;
  }
  /* PROGRAMS (centers) */
  .program-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; margin-top: 20px; }
  .program-card { background: var(--beige); border-radius: 2rem; overflow: hidden; box-shadow: 0 10px 30px rgba(27,42,74,0.08); }
  .program-photo {
    height: 220px; background: center/cover no-repeat; display: block; width: 100%;
    border: none; padding: 0; cursor: pointer; transition: opacity 0.2s;
  }
  .program-photo:hover { opacity: 0.88; }
  .program-body { padding: 28px 32px 32px; }
  .program-body h3 { font-size: 1.35rem; color: var(--brown); margin-bottom: 6px; }
  .program-trainer {
    font-family: Arial, sans-serif; font-size: 0.78rem; color: var(--orange);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; font-weight: bold;
  }
  .program-body p { color: var(--text-light); line-height: 1.7; margin-bottom: 14px; font-size: 0.95rem; }
  .whats-next-label { text-align: center; margin: 64px 0 24px; }
  /* MILESTONES (2025 timeline) */
  .milestones-label { text-align: center; margin-bottom: 24px; }
  .milestone-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 56px; }
  .milestone-item {
    display: flex; gap: 20px; align-items: center;
    background: var(--beige); border-radius: 1.5rem; padding: 16px;
  }
  .milestone-img {
    width: 96px; height: 96px; border-radius: 1rem; flex-shrink: 0;
    background: center/cover no-repeat; border: none; padding: 0;
    cursor: pointer; transition: transform 0.2s;
  }
  .milestone-img:hover { transform: scale(1.05); }
  .zoomable:hover { opacity: 0.88; }
  .about-image.zoomable, .project-img.zoomable, .hfaac-image.zoomable {
    display: block; width: 100%; border: none; padding: 0; cursor: pointer;
    font: inherit; transition: opacity 0.2s;
  }
  .milestone-date {
    font-family: Arial, sans-serif; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--orange); margin-bottom: 4px;
  }
  .milestone-text h4 { color: var(--brown); font-size: 1.05rem; margin-bottom: 4px; }
  .milestone-text p { color: var(--text-light); font-size: 0.9rem; line-height: 1.6; font-family: Arial, sans-serif; margin: 0; }
  /* IMPACT */
  #impact { background: var(--beige-dark); }
  .impact-inner { max-width: 1000px; margin: 0 auto; text-align: center; }
  .impact-inner h2 { color: var(--brown); margin-bottom: 16px; }
  .impact-inner .section-intro { color: var(--text-light); margin: 0 auto 60px; }
  .impact-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .impact-card {
    background: white; border: 1px solid rgba(51,69,94,0.08);
    border-radius: 1.5rem; padding: 32px 20px;
  }
  .impact-number { font-size: 2.8rem; color: var(--orange); margin-bottom: 8px; font-weight: bold; }
  .impact-label { font-family: Arial, sans-serif; font-size: 0.85rem; color: var(--text-light); line-height: 1.4; }
  /* VISION */
  #vision { background: var(--beige); }
  .vision-inner { max-width: 900px; margin: 0 auto; }
  .vision-list { margin-top: 40px; display: flex; flex-direction: column; gap: 20px; }
  .vision-item {
    display: flex; gap: 20px; align-items: flex-start;
    background: white; padding: 24px 28px; border-radius: 1.5rem;
    box-shadow: 0 4px 20px rgba(27,42,74,0.08);
  }
  .vision-number {
    width: 40px; height: 40px; border-radius: 50%; background: var(--orange);
    color: white; display: flex; align-items: center; justify-content: center;
    font-family: Arial, sans-serif; font-weight: bold; flex-shrink: 0;
  }
  .vision-text h4 { color: var(--brown); margin-bottom: 6px; font-size: 1rem; }
  .vision-text p { color: var(--text-light); font-size: 0.9rem; line-height: 1.7; font-family: Arial, sans-serif; }
  /* DONATE */
  #donate { background: linear-gradient(135deg, var(--orange) 0%, #b8842a 100%); color: white; text-align: center; }
  #donate h2 { color: white; margin-bottom: 16px; }
  #donate p { max-width: 600px; margin: 0 auto 40px; opacity: 0.9; font-size: 1.1rem; line-height: 1.8; }
  .donate-options { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
  .donate-btn {
    background: white; color: var(--orange); padding: 16px 36px;
    border-radius: 999px; text-decoration: none; font-family: Arial, sans-serif;
    font-weight: bold; font-size: 1rem; transition: all 0.2s;
    border: none; cursor: pointer;
  }
  .donate-btn:hover { background: var(--brown); color: white; }
  .donate-note { font-size: 0.85rem; opacity: 0.8; font-family: Arial, sans-serif; }
  .bank-details { display: flex; flex-direction: column; gap: 14px; margin: 18px 0 20px; text-align: left; }
  .bank-row { display: flex; flex-direction: column; gap: 2px; font-family: Arial, sans-serif; }
  .bank-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--orange); }
  .bank-value { font-size: 0.95rem; color: var(--brown); font-weight: bold; }
  .bank-note { font-size: 0.85rem; color: var(--text-light); font-family: Arial, sans-serif; }
  .help-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
    max-width: 1100px; margin: 0 auto 48px;
  }
  .help-card {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 1.25rem; padding: 22px 16px; text-align: center;
    display: block; text-decoration: none; color: white; cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .help-card:hover { background: rgba(255,255,255,0.28); transform: translateY(-3px); }
  .help-icon { font-size: 1.8rem; margin-bottom: 10px; }
  .help-card h4 { font-family: Arial, sans-serif; font-size: 0.9rem; margin-bottom: 6px; }
  .help-card p { font-family: Arial, sans-serif; font-size: 0.78rem; opacity: 0.85; line-height: 1.4; margin: 0; }
  /* HFAAC */
  #hfaac { background: white; }
  .hfaac-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; max-width: 1100px; margin: 0 auto; align-items: center; }
  .hfaac-image {
    border-radius: 2rem; overflow: hidden; height: 380px;
    background: url('images/hfaac.jpg') center/cover;
    box-shadow: 0 20px 60px rgba(27,42,74,0.2);
  }
  .hfaac-inner { text-align: left; }
  .hfaac-inner h2 { margin-bottom: 16px; }
  .hfaac-inner p { color: var(--text-light); line-height: 1.8; margin-bottom: 18px; }
  .hfaac-facts { list-style: none; margin: 0 0 28px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hfaac-facts li {
    font-family: Arial, sans-serif; font-size: 0.92rem; color: var(--brown);
    padding-left: 22px; position: relative; line-height: 1.5;
  }
  .hfaac-facts li::before { content: '●'; color: var(--orange); position: absolute; left: 0; font-size: 0.6rem; top: 6px; }
  .hfaac-link {
    display: inline-block; background: var(--brown); color: white;
    padding: 14px 36px; border-radius: 999px; text-decoration: none;
    font-family: Arial, sans-serif; font-weight: bold; transition: background 0.2s;
  }
  .hfaac-link:hover { background: var(--orange); }
  /* FOOTER */
  footer {
    background: var(--beige); color: var(--brown); text-align: center;
    border-top: 3px solid var(--orange);
    padding: 40px; font-family: Arial, sans-serif; font-size: 0.85rem;
  }
  footer p { color: var(--text-light); margin-top: 8px; }
  @media (max-width: 768px) {
    nav { padding: 0 16px; height: 64px; }
    .nav-links { display: none; }
    .nav-logo { gap: 8px; font-size: 1.05rem; }
    .nav-logo img { height: 40px; }
    .nav-donate { padding: 8px 16px; font-size: 0.75rem; }
    section { padding: 60px 20px; }
    .about-grid { grid-template-columns: 1fr; }
    .project-card { grid-template-columns: 1fr !important; }
    .project-card:nth-child(even) .project-img { order: 1; }
    .project-card:nth-child(even) .project-content { order: 2; }
    .impact-grid { grid-template-columns: repeat(2, 1fr); }
    .program-grid { grid-template-columns: 1fr; }
    .hfaac-grid { grid-template-columns: 1fr; }
    .milestone-item { flex-direction: column; align-items: flex-start; }
    .milestone-img { width: 100%; height: 160px; }
    .help-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<!-- NAV -->
<nav>
  <a href="#" class="nav-logo"><img src="images/logo-icon.png" alt="Crafting Futures logo" />Crafting <span>Futures</span></a>
  <ul class="nav-links">
    <li><a href="#about">Who We Are</a></li>
    <li><a href="#programs">Programs</a></li>
    <li><a href="#train-the-trainer">Trainers</a></li>
    <li><a href="#impact">Impact</a></li>
    <li><a href="#hfaac">HFAAC</a></li>
  </ul>
  <a href="#donate" class="nav-donate">❤ Donate</a>
</nav>
<!-- HERO -->
<section class="hero" id="home">
  <div class="hero-slideshow" id="hero-slideshow"></div>
  <div class="hero-content">
    <div class="hero-tag" id="hero-tag"></div>
    <h1>Crafting <span>Futures</span></h1>
    <p id="hero-subtitle"></p>
    <div class="hero-buttons">
      <a href="#programs" class="btn-primary" id="hero-btn-primary"></a>
      <a href="#donate" class="btn-outline" id="hero-btn-outline"></a>
    </div>
  </div>
</section>
<!-- WHO WE ARE -->
<section id="about">
  <div class="about-grid">
    <button class="about-image zoomable" id="about-image" aria-label="Enlarge photo"></button>
    <div class="about-text">
      <div class="section-label" id="about-label"></div>
      <h2 id="about-heading"></h2>
      <div id="about-paragraphs"></div>
      <div class="team-list">
        <button class="team-member team-member-combined" id="team-photo-trigger">
          <div class="team-dot"></div>
          <span id="about-team-names"></span>
          <span class="team-photo-hint">📷 tap to see us</span>
        </button>
      </div>
    </div>
  </div>
</section>
<!-- PROGRAMS -->
<section id="programs">
  <div class="projects-inner">
    <div class="projects-header">
      <div class="section-label" id="programs-label"></div>
      <h2 id="programs-heading"></h2>
      <p class="section-intro" id="programs-intro"></p>
    </div>

    <div class="program-grid" id="program-grid"></div>

    <div class="milestones-label" style="margin-top: 64px;">
      <div class="section-label" id="milestones-label"></div>
    </div>
    <div class="milestone-list" id="milestone-list"></div>

    <div class="whats-next-label">
      <div class="section-label" id="whatsnext-label"></div>
    </div>
    <div class="project-card upcoming" id="whatsnext-card"></div>
  </div>
</section>
<!-- TRAIN THE TRAINER -->
<section id="train-the-trainer" style="background: var(--beige);">
  <div class="vision-inner">
    <div class="section-label" id="trainer-label"></div>
    <h2 id="trainer-heading"></h2>
    <p class="section-intro" id="trainer-intro"></p>
    <div class="vision-list" id="trainer-list"></div>
    <p id="trainer-footer-note" style="margin-top: 28px; color: var(--text-light); font-family: Arial, sans-serif; font-size: 0.9rem; line-height: 1.7;"></p>
  </div>
</section>
<!-- IMPACT -->
<section id="impact">
  <div class="impact-inner">
    <div class="section-label" id="impact-label" style="color: var(--orange-light);"></div>
    <h2 id="impact-heading"></h2>
    <p class="section-intro" id="impact-intro"></p>
    <div class="impact-grid" id="impact-grid"></div>
  </div>
</section>
<!-- VISION -->
<section id="vision">
  <div class="vision-inner">
    <div class="section-label" id="vision-label"></div>
    <h2 id="vision-heading"></h2>
    <p class="section-intro" id="vision-intro"></p>
    <div class="vision-list" id="vision-list"></div>
  </div>
</section>
<!-- DONATE -->
<section id="donate">
  <div class="section-label" id="donate-label" style="color: rgba(255,255,255,0.7);"></div>
  <h2 id="donate-heading"></h2>
  <p id="donate-intro"></p>
  <div class="help-grid" id="help-grid"></div>
  <div class="donate-options">
    <a href="#" class="donate-btn" id="donate-contact-btn"></a>
    <a href="#hfaac" class="donate-btn" id="donate-hfaac-btn"></a>
    <button class="donate-btn" id="bank-transfer-btn"></button>
  </div>
  <p class="donate-note" id="donate-note"></p>
</section>
<!-- HFAAC -->
<section id="hfaac">
